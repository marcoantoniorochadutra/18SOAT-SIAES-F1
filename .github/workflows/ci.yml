name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [ opened, synchronize, reopened ]

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  TRIVY_EXIT_CODE: "0"

jobs:
  build:
    name: Build, tests, coverage and SonarCloud
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: siaes_it
          POSTGRES_USER: siaes
          POSTGRES_PASSWORD: siaes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siaes -d siaes_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: siaes
      DB_PASSWORD: siaes
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      - name: Unit and integration tests with JaCoCo check
        run: mvn -B verify

      - name: Cache SonarCloud packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: mvn -B sonar:sonar

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  security:
    name: Vulnerability analysis (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: siaes-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan repository (secrets, Dockerfile/compose)
        run: |
          mkdir -p trivy-reports
          docker run --rm -v "$PWD:/src" -v trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" \
            fs --offline-scan --scanners secret,misconfig --skip-dirs /src/trivy-reports \
            --format json --output /src/trivy-reports/fs.json /src

      - name: Scan image (Alpine packages, Java runtime, jars)
        run: |
          docker run --rm -v "$PWD:/src" -v trivy-cache:/root/.cache/trivy \
            -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --format json --output /src/trivy-reports/image.json siaes-app:ci

      - name: Convert reports and write job summary
        run: |
          for scan in fs image; do
            docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" \
              convert --format sarif --output "/src/trivy-reports/$scan.sarif" "/src/trivy-reports/$scan.json"
            {
              echo "## Trivy: $scan"
              echo '```'
              docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" \
                convert --format table --severity HIGH,CRITICAL "/src/trivy-reports/$scan.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Publish repository findings to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: trivy-reports/fs.sarif
          category: trivy-fs

      - name: Publish image findings to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: trivy-reports/image.sarif
          category: trivy-image

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trivy-reports
          path: trivy-reports

      - name: Enforce severity gate
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" \
            convert --format table --severity HIGH,CRITICAL --exit-code "$TRIVY_EXIT_CODE" \
            /src/trivy-reports/fs.json > /dev/null
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" \
            convert --format table --severity HIGH,CRITICAL --exit-code "$TRIVY_EXIT_CODE" \
            /src/trivy-reports/image.json > /dev/null
