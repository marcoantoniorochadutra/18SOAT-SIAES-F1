spring:

  application:
    name: siaes

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  threads:
    virtual:
      enabled: true

  flyway:
    enabled: true
    default-schema: siaes
    create-schemas: true

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: siaes-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 120000
      validation-timeout: 60000
      idle-timeout: 120000
      keepalive-time: 60000
      max-lifetime: 250000
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: validate
    generate-ddl: false
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: siaes
        show_sql: false
        format_sql: true
        use_sql_comments: false
        generate_statistics: false

  transaction:
    default-timeout: 30s

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

siaes:
  mail:
    from: ${MAIL_FROM:no-reply@siaes.com}

server:
  port: ${SERVER_PORT:8715}
  shutdown: graceful
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}

logging:
  level:
    root: INFO
    com.mbd.siaes: ${LOG_LEVEL_APP:INFO}
    org.springframework: INFO
    org.hibernate: WARN