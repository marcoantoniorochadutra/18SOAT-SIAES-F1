spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

siaes:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-expiration-days: ${SIAES_AUTH_TOKEN_EXPIRATION}
      refresh-expiration-hours: ${SIAES_AUTH_TOKEN_REFRESH_EXPIRATION}
  mail:
    from: ${MAIL_FROM}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${APP_VERSION}
        environment: ${APP_ENVIRONMENT}
  level:
    org.hibernate.SQL: WARN