workorder.list.parameter.document=CPF ou CNPJ completo do cliente, com ou sem pontuação. A busca é exata.
workorder.list.parameter.vehicleId=Id do veículo.
workorder.list.parameter.status=Status da ordem de serviço (RECEIVED, IN_DIAGNOSIS, AWAITING_APPROVAL, IN_EXECUTION, FINISHED, DELIVERED ou CANCELLED).
workorder.list.response.success=Lista de ordens de serviço retornada com sucesso

quotation.approvalLink.summary=Retorna o link de aprovação do orçamento
quotation.approvalLink.description=Retorna o mesmo link de aprovação enviado ao cliente, para que a oficina possa repassá-lo manualmente (por exemplo, pelo WhatsApp). Se o link atual expirou ou não existe, um novo link válido por 72 horas é gerado.
quotation.approvalLink.response.success=Link de aprovação retornado com sucesso
quotation.decision.response.conflict=O orçamento não aguarda aprovação ou a ordem de serviço não pode iniciar a execução

quotation.decide.summary=Aprova ou rejeita o próprio orçamento
quotation.decide.description=Permite que o cliente autenticado decida sobre um orçamento que aguarda aprovação (APPROVE ou REJECT). Na aprovação, a ordem de serviço passa para IN_EXECUTION. Na rejeição, informando opcionalmente o motivo, a reserva de estoque dos insumos é liberada e a ordem de serviço aguarda um novo orçamento.
quotation.decide.response.success=Decisão registrada com sucesso
quotation.decide.response.badrequest=Dados inválidos para a decisão do orçamento

quotationApproval.tag.description=Aprovação de orçamentos pelo link enviado ao cliente, sem necessidade de login. O link é válido por 72 horas, pode ser usado uma única vez e exige os 4 últimos dígitos do documento do cliente para aprovar ou rejeitar.
quotationApproval.parameter.token=Token do link de aprovação.
quotationApproval.response.notfound=Link de aprovação inexistente, expirado ou já utilizado
quotationApproval.response.badrequest=Dados inválidos ou últimos dígitos do documento não conferem
quotationApproval.response.conflict=O orçamento não aguarda aprovação ou a ordem de serviço não pode iniciar a execução

quotationApproval.get.summary=Consulta o orçamento pelo link de aprovação
quotationApproval.get.description=Retorna os itens, o valor total, o veículo e a validade do link, sem dados pessoais do cliente além do nome.
quotationApproval.get.response.success=Orçamento encontrado com sucesso

quotationApproval.decide.summary=Aprova ou rejeita o orçamento pelo link
quotationApproval.decide.description=Registra a decisão (APPROVE ou REJECT) após conferir os 4 últimos dígitos do documento do cliente, e o link deixa de ser válido. Na aprovação, a ordem de serviço passa para IN_EXECUTION. Na rejeição, informando opcionalmente o motivo, a reserva de estoque é liberada.
quotationApproval.decide.response.success=Decisão registrada com sucesso
