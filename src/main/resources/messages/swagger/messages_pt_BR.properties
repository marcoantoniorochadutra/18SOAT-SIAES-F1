customer.tag.description=Gestão de clientes

customer.create.summary=Cria um novo cliente
customer.create.description=Cria um novo cliente com os dados fornecidos no corpo da requisi\u00E7\u00E3o
customer.create.response.success=Cliente criado com sucesso
customer.create.response.badrequest=Dados inv\u00E1lidos para cria\u00E7\u00E3o do cliente

customer.update.summary=Atualiza um cliente existente
customer.update.description=Atualiza os dados de um cliente existente com base no id informado
customer.update.response.success=Cliente atualizado com sucesso
customer.update.response.badrequest=Dados inv\u00E1lidos para atualiza\u00E7\u00E3o do cliente
customer.update.response.notfound=Cliente n\u00E3o encontrado

customer.get.summary=Busca um cliente pelo id
customer.get.description=Retorna os dados de um cliente com base no id informado
customer.get.response.success=Cliente encontrado com sucesso
customer.get.response.notfound=Cliente n\u00E3o encontrado

customer.list.summary=Lista os clientes
customer.list.description=Retorna os clientes cadastrados ordenados por nome. Os filtros são opcionais e combinados entre si (todos precisam ser atendidos); sem filtros, retorna todos os clientes.
customer.list.parameter.name=Parte do nome do cliente, sem diferenciar maiúsculas e minúsculas.
customer.list.parameter.document=CPF ou CNPJ completo, com ou sem pontuação. A busca é exata.
customer.list.parameter.email=Parte do e-mail do cliente, sem diferenciar maiúsculas e minúsculas.
customer.list.parameter.phone=Parte do telefone do cliente.
customer.list.response.success=Lista de clientes retornada com sucesso

customer.delete.summary=Remove um cliente
customer.delete.description=Remove um cliente existente com base no id informado
customer.delete.response.success=Cliente removido com sucesso
customer.delete.response.notfound=Cliente n\u00E3o encontrado


user.tag.description=Gestão de usuários

user.create.summary=Cria um novo usuário
user.create.description=Registra um novo usuário. É obrigatório informar o e-mail do usuário ou vinculá-lo a um cliente existente (ou ambos); usuários com perfil CUSTOMER precisam estar vinculados a um cliente. Somente usuários com perfil MANAGER ou superior podem realizar esta operação, e não é possível criar um usuário com perfil superior ao do usuário autenticado. Um e-mail de ativação é enviado ao cliente para ativação do usuário.
user.create.response.success=Usuário criado com sucesso
user.create.response.badrequest=Dados inválidos para criação do usuário
user.create.response.forbidden=Usuário autenticado não possui permissão para criar usuários com o perfil informado
user.create.response.conflict=E-mail já cadastrado

auth.tag.description=Autenticação de usuários

auth.login.summary=Autentica um usuário e retorna um token
auth.login.description=Autentica um usuário com base no e-mail e senha informados e retorna um token de acesso e um token de atualização
auth.login.response.success=Usuário autenticado com sucesso
auth.login.response.unauthorized=Senha inválida
auth.login.response.notfound=Usuário não encontrado para o e-mail informado

auth.logout.summary=Invalida o token de acesso atual
auth.logout.description=Adiciona o token de acesso informado no cabeçalho Authorization a uma blocklist, impedindo seu uso em requisições futuras até a sua expiração
auth.logout.response.success=Logout realizado com sucesso
auth.logout.response.badrequest=Cabeçalho Authorization ausente ou mal formatado


common.header.accept-language.description=Idioma preferido para o conteúdo da resposta (pt-BR ou en-US)


common.parameter.page=Número da página, começando em 0. Padrão: 0.
common.parameter.size=Quantidade de itens por página, entre 1 e 100. Padrão: 20.
