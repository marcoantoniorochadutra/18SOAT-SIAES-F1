stock.move.summary=Registra uma movimenta\u00E7\u00E3o manual de estoque
stock.move.description=ENTRY (compra/reposi\u00E7\u00E3o) aceita apenas quantidade positiva. ADJUSTMENT (corre\u00E7\u00E3o de invent\u00E1rio: perda, quebra, contagem) aceita quantidade positiva ou negativa e exige o motivo. Baixas n\u00E3o podem consumir unidades reservadas. A baixa por ordem de servi\u00E7o n\u00E3o passa por este endpoint.
stock.move.response.success=Movimenta\u00E7\u00E3o registrada com sucesso
stock.move.response.badrequest=Tipo de movimenta\u00E7\u00E3o ausente ou inv\u00E1lido, quantidade inv\u00E1lida ou motivo n\u00E3o informado para ajuste
stock.move.response.conflict=Estoque dispon\u00EDvel insuficiente ou registro alterado por outra opera\u00E7\u00E3o simult\u00E2nea

stock.movements.summary=Lista o hist\u00F3rico de movimenta\u00E7\u00F5es de estoque
stock.movements.description=Retorna as movimenta\u00E7\u00F5es da pe\u00E7a/insumo da mais recente para a mais antiga, com o saldo e a reserva ap\u00F3s cada movimenta\u00E7\u00E3o. O hist\u00F3rico \u00E9 gravado de forma ass\u00EDncrona e pode levar alguns instantes para refletir a \u00FAltima movimenta\u00E7\u00E3o.
stock.movements.response.success=Hist\u00F3rico retornado com sucesso
