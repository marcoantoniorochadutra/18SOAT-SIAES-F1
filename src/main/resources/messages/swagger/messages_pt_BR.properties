user.create.summary=Cria um novo usu\u00E1rio
user.create.description=Registra um novo usu\u00E1rio. \u00C9 obrigat\u00F3rio informar o e-mail do usu\u00E1rio ou vincul\u00E1-lo a um cliente existente (ou ambos); usu\u00E1rios com perfil CUSTOMER precisam estar vinculados a um cliente. Somente usu\u00E1rios com perfil MANAGER ou superior podem realizar esta opera\u00E7\u00E3o, e n\u00E3o \u00E9 poss\u00EDvel criar um usu\u00E1rio com perfil superior ao do usu\u00E1rio autenticado. Um e-mail de ativa\u00E7\u00E3o \u00E9 enviado ao cliente para ativa\u00E7\u00E3o do usu\u00E1rio.
