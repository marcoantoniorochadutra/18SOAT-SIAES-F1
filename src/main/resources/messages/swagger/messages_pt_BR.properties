supplies.deactivate.summary=Inativa uma pe\u00E7a/insumo
supplies.deactivate.description=Inativa uma pe\u00E7a/insumo com base no id informado. A pe\u00E7a deixa de ser listada e n\u00E3o pode mais ser reservada, mas o estoque, as reservas existentes e o hist\u00F3rico s\u00E3o preservados.
