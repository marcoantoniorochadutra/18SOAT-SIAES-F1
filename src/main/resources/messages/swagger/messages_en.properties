customer.tag.description=Customer management

customer.response.notfound=Customer not found

customer.create.summary=Create a new customer
customer.create.description=Creates a new customer with the data provided in the request body
customer.create.response.success=Customer created successfully
customer.create.response.badrequest=Invalid data for customer creation

customer.update.summary=Update an existing customer
customer.update.description=Updates the data of an existing customer based on the given id
customer.update.response.success=Customer updated successfully
customer.update.response.badrequest=Invalid data for customer update

customer.get.summary=Get a customer by id
customer.get.description=Returns the data of a customer based on the given id
customer.get.response.success=Customer found successfully

customer.list.summary=List customers
customer.list.description=Returns the registered customers ordered by name. Filters are optional and combined (all of them must match); without filters, returns all customers.
customer.list.parameter.name=Part of the customer name, case-insensitive.
customer.list.parameter.document=Full CPF or CNPJ, with or without punctuation. Exact match.
customer.list.parameter.email=Part of the customer email, case-insensitive.
customer.list.parameter.phone=Part of the customer phone.
customer.list.response.success=Customer list returned successfully

customer.delete.summary=Delete a customer
customer.delete.description=Removes an existing customer based on the given id
customer.delete.response.success=Customer deleted successfully

user.tag.description=User management

user.create.summary=Create a new user
user.create.description=Registers a new user. The user's email or a link to an existing customer (or both) is required; users with the CUSTOMER role must be linked to a customer. Only users with the MANAGER role or above can perform this operation, and a user cannot be created with a role higher than the authenticated user's own role. An activation email is sent to the customer to activate the user.
user.create.response.success=User created successfully
user.create.response.badrequest=Invalid data for user creation
user.create.response.forbidden=The authenticated user is not allowed to create users with the given role
user.create.response.conflict=Email already registered

auth.tag.description=User authentication

auth.login.summary=Authenticates a user and returns a token
auth.login.description=Authenticates a user based on the given email and password, returning an access token and a refresh token
auth.login.response.success=User authenticated successfully
auth.login.response.unauthorized=Invalid password
auth.login.response.notfound=User not found for the given email

auth.logout.summary=Invalidates the current access token
auth.logout.description=Adds the access token provided in the Authorization header to a blocklist, preventing its use in future requests until it expires
auth.logout.response.success=Logout successful
auth.logout.response.badrequest=Missing or malformed Authorization header

vehicle.tag.description=Vehicle management

vehicle.response.notfound=Vehicle not found
vehicle.response.conflict=Plate already registered

vehicle.create.summary=Register a new vehicle
vehicle.create.description=Registers a new vehicle linked to an existing customer. Users with the MECHANIC role cannot perform this operation.
vehicle.create.response.success=Vehicle registered successfully
vehicle.create.response.badrequest=Invalid data for vehicle registration
vehicle.create.response.forbidden=The authenticated user is not allowed to register vehicles
vehicle.create.response.notfound=Owner customer not found

vehicle.update.summary=Update an existing vehicle
vehicle.update.description=Updates the data of an existing vehicle based on the given id
vehicle.update.response.success=Vehicle updated successfully
vehicle.update.response.badrequest=Invalid data for vehicle update

vehicle.get.summary=Get a vehicle by id
vehicle.get.description=Returns the data of a vehicle based on the given id, including the owner customer's id and name
vehicle.get.response.success=Vehicle found successfully

vehicle.list.summary=List vehicles
vehicle.list.description=Returns the registered vehicles ordered by id. Filters are optional and combined (all of them must match); without filters, returns all vehicles.
vehicle.list.parameter.plate=Full or partial plate, with or without punctuation. Case-insensitive.
vehicle.list.parameter.brand=Part of the vehicle brand, case-insensitive.
vehicle.list.parameter.model=Part of the vehicle model, case-insensitive.
vehicle.list.parameter.year=Exact manufacturing year.
vehicle.list.parameter.customerId=Id of the owner customer. Exact match.
vehicle.list.response.success=Vehicle list returned successfully

vehicle.delete.summary=Delete a vehicle
vehicle.delete.description=Removes an existing vehicle based on the given id
vehicle.delete.response.success=Vehicle deleted successfully

common.header.accept-language.description=Preferred language for the response content (pt-BR or en-US)

common.parameter.page=Page number, starting at 0. Default: 0.
common.parameter.size=Number of items per page, between 1 and 100. Default: 20.

supplies.response.notfound=Supply not found
supplies.response.conflict=SKU already registered
supplies.response.forbidden=The authenticated user is not allowed to manage parts and supplies

supplies.create.summary=Register a new supply
supplies.create.response.success=Supply registered successfully
supplies.create.response.badrequest=Invalid data for supply registration

supplies.update.summary=Update an existing supply
supplies.update.response.success=Supply updated successfully
supplies.update.response.badrequest=Invalid data for supply update

supplies.get.summary=Get a supply by id
supplies.get.description=Returns the data of a supply based on the given id
supplies.get.response.success=Supply found successfully

supplies.list.summary=List supplies
supplies.list.description=Returns the registered supplies ordered by description. Filters are optional and combined (all of them must match); without filters, returns all items.
supplies.list.parameter.sku=Full or partial SKU. Case-insensitive.
supplies.list.parameter.description=Part of the supply description, case-insensitive.
supplies.list.response.success=Supply list returned successfully
supplies.tag.description=Parts and supplies catalog (SKU, description and price). Stock is managed under Stock. Access restricted to users with the MANAGER role or above.
supplies.create.description=Registers a new part/supply with a unique SKU, description and unit price. The given initial stock creates the supply's stock and an INITIAL movement in the history.
supplies.update.description=Updates the SKU, description and unit price of a supply based on the given id. Stock only changes through the Stock endpoints.
supplies.list.parameter.active=Supply status. Default: true (active only); use false to list inactive ones.
supplies.deactivate.summary=Deactivate a supply
supplies.deactivate.description=Deactivates a supply based on the given id. It is no longer listed and can no longer be reserved, but its stock, existing reservations and history are kept.
supplies.deactivate.response.success=Supply deactivated successfully
supplies.deactivate.response.conflict=Supply is already inactive
supplies.activate.summary=Activate a supply
supplies.activate.description=Reactivates an inactive supply based on the given id. It is listed again and can be reserved again.
supplies.activate.response.success=Supply activated successfully
supplies.activate.response.conflict=Supply is already active

stock.tag.description=Parts and supplies stock: balance, reservations, manual movements and history. Access restricted to users with the MANAGER role or above.

stock.response.notfound=Supply stock not found
stock.response.forbidden=The authenticated user is not allowed to manage stock

stock.get.summary=Get a supply's stock
stock.get.description=Returns the quantity in stock, the quantity reserved for quotations and the available quantity (stock minus reserved)
stock.get.response.success=Stock returned successfully

stock.move.summary=Register a manual stock movement
stock.move.description=ENTRY (purchase/restock) only accepts a positive quantity. ADJUSTMENT (inventory correction: loss, breakage, count) accepts a positive or negative quantity and requires a reason. Withdrawals cannot consume reserved units. Work order consumption does not go through this endpoint.
stock.move.response.success=Movement registered successfully
stock.move.response.badrequest=Missing or invalid movement type, invalid quantity or missing reason for an adjustment
stock.move.response.conflict=Insufficient available stock or record changed by another concurrent operation

stock.movements.summary=List the stock movement history
stock.movements.description=Returns the supply's movements from newest to oldest, with the balance and reservation after each movement. The history is recorded asynchronously and may take a moment to reflect the latest movement.
stock.movements.response.success=History returned successfully
