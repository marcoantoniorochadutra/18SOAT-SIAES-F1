customer.tag.description=Customer management

customer.response.notfound=Customer not found

customer.create.summary=Create a new customer
customer.create.description=Creates a new customer with the data provided in the request body
customer.create.response.success=Customer created successfully
customer.create.response.badrequest=Invalid data for customer creation

customer.update.summary=Update an existing customer
customer.update.description=Updates the data of an existing customer based on the given id
customer.update.response.success=Customer updated successfully
customer.update.response.badrequest=Invalid data for customer update

customer.get.summary=Get a customer by id
customer.get.description=Returns the data of a customer based on the given id
customer.get.response.success=Customer found successfully

customer.list.summary=List customers
customer.list.description=Returns the registered customers ordered by name. Filters are optional and combined (all of them must match); without filters, returns all customers.
customer.list.parameter.name=Part of the customer name, case-insensitive.
customer.list.parameter.document=Full CPF or CNPJ, with or without punctuation. Exact match.
customer.list.parameter.email=Part of the customer email, case-insensitive.
customer.list.parameter.phone=Part of the customer phone.
customer.list.response.success=Customer list returned successfully

customer.delete.summary=Delete a customer
customer.delete.description=Removes an existing customer based on the given id
customer.delete.response.success=Customer deleted successfully

user.tag.description=User management

user.create.summary=Create a new user
user.create.description=Registers a new user. The user's email or a link to an existing customer (or both) is required; users with the CUSTOMER role must be linked to a customer. Only users with the MANAGER role or above can perform this operation, and a user cannot be created with a role higher than the authenticated user's own role. An activation email is sent to the customer to activate the user.
user.create.response.success=User created successfully
user.create.response.badrequest=Invalid data for user creation
user.create.response.forbidden=The authenticated user is not allowed to create users with the given role
user.create.response.conflict=Email already registered

auth.tag.description=User authentication

auth.login.summary=Authenticates a user and returns a token
auth.login.description=Authenticates a user based on the given email and password, returning an access token and a refresh token
auth.login.response.success=User authenticated successfully
auth.login.response.unauthorized=Invalid password
auth.login.response.notfound=User not found for the given email

auth.logout.summary=Invalidates the current access token
auth.logout.description=Adds the access token provided in the Authorization header to a blocklist, preventing its use in future requests until it expires
auth.logout.response.success=Logout successful
auth.logout.response.badrequest=Missing or malformed Authorization header

vehicle.tag.description=Vehicle management

vehicle.response.notfound=Vehicle not found
vehicle.response.conflict=Plate already registered

vehicle.create.summary=Register a new vehicle
vehicle.create.description=Registers a new vehicle linked to an existing customer. Users with the MECHANIC role cannot perform this operation.
vehicle.create.response.success=Vehicle registered successfully
vehicle.create.response.badrequest=Invalid data for vehicle registration
vehicle.create.response.forbidden=The authenticated user is not allowed to register vehicles
vehicle.create.response.notfound=Owner customer not found

vehicle.update.summary=Update an existing vehicle
vehicle.update.description=Updates the data of an existing vehicle based on the given id
vehicle.update.response.success=Vehicle updated successfully
vehicle.update.response.badrequest=Invalid data for vehicle update

vehicle.get.summary=Get a vehicle by id
vehicle.get.description=Returns the data of a vehicle based on the given id, including the owner customer's id and name
vehicle.get.response.success=Vehicle found successfully

vehicle.list.summary=List vehicles
vehicle.list.description=Returns the registered vehicles ordered by id. Filters are optional and combined (all of them must match); without filters, returns all vehicles. Customers only receive their own vehicles.
vehicle.list.parameter.plate=Full or partial plate, with or without punctuation. Case-insensitive.
vehicle.list.parameter.brand=Part of the vehicle brand, case-insensitive.
vehicle.list.parameter.model=Part of the vehicle model, case-insensitive.
vehicle.list.parameter.year=Exact manufacturing year.
vehicle.list.parameter.customerId=Id of the owner customer. Exact match.
vehicle.list.response.success=Vehicle list returned successfully

vehicle.delete.summary=Delete a vehicle
vehicle.delete.description=Removes an existing vehicle based on the given id
vehicle.delete.response.success=Vehicle deleted successfully

common.header.accept-language.description=Preferred language for the response content (pt-BR or en-US)

common.parameter.page=Page number, starting at 0. Default: 0.
common.parameter.size=Number of items per page, between 1 and 100. Default: 20.

supplies.response.notfound=Supply not found
supplies.response.conflict=SKU already registered
supplies.response.forbidden=The authenticated user is not allowed to manage parts and supplies

supplies.create.summary=Register a new supply
supplies.create.response.success=Supply registered successfully
supplies.create.response.badrequest=Invalid data for supply registration

supplies.update.summary=Update an existing supply
supplies.update.response.success=Supply updated successfully
supplies.update.response.badrequest=Invalid data for supply update

supplies.get.summary=Get a supply by id
supplies.get.description=Returns the data of a supply based on the given id
supplies.get.response.success=Supply found successfully

supplies.list.summary=List supplies
supplies.list.description=Returns the registered supplies ordered by description. Filters are optional and combined (all of them must match); without filters, returns all items.
supplies.list.parameter.sku=Full or partial SKU. Case-insensitive.
supplies.list.parameter.description=Part of the supply description, case-insensitive.
supplies.list.response.success=Supply list returned successfully
supplies.tag.description=Parts and supplies catalog (SKU, description and price). Stock is managed under Stock. Access restricted to users with the MANAGER role or above.
supplies.create.description=Registers a new part/supply with a unique SKU, description and unit price. The given initial stock creates the supply's stock and an INITIAL movement in the history.
supplies.update.description=Updates the SKU, description and unit price of a supply based on the given id. Stock only changes through the Stock endpoints.
supplies.list.parameter.active=Supply status. Default: true (active only); use false to list inactive ones.
supplies.deactivate.summary=Deactivate a supply
supplies.deactivate.description=Deactivates a supply based on the given id. It is no longer listed and can no longer be reserved, but its stock, existing reservations and history are kept.
supplies.deactivate.response.success=Supply deactivated successfully
supplies.deactivate.response.conflict=Supply is already inactive
supplies.activate.summary=Activate a supply
supplies.activate.description=Reactivates an inactive supply based on the given id. It is listed again and can be reserved again.
supplies.activate.response.success=Supply activated successfully
supplies.activate.response.conflict=Supply is already active

stock.tag.description=Parts and supplies stock: balance, reservations, manual movements and history. Access restricted to users with the MANAGER role or above.

stock.response.notfound=Supply stock not found
stock.response.forbidden=The authenticated user is not allowed to manage stock

stock.get.summary=Get a supply's stock
stock.get.description=Returns the quantity in stock, the quantity reserved for quotations and the available quantity (stock minus reserved)
stock.get.response.success=Stock returned successfully

stock.move.summary=Register a manual stock movement
stock.move.description=ENTRY (purchase/restock) only accepts a positive quantity. ADJUSTMENT (inventory correction: loss, breakage, count) accepts a positive or negative quantity and requires a reason. Withdrawals cannot consume reserved units. Work order consumption does not go through this endpoint.
stock.move.response.success=Movement registered successfully
stock.move.response.badrequest=Missing or invalid movement type, invalid quantity or missing reason for an adjustment
stock.move.response.conflict=Insufficient available stock or record changed by another concurrent operation

stock.movements.summary=List the stock movement history
stock.movements.description=Returns the supply's movements from newest to oldest, with the balance and reservation after each movement. The history is recorded asynchronously and may take a moment to reflect the latest movement.
stock.movements.response.success=History returned successfully

maintenance.tag.description=Catalog of services provided by the workshop (e.g. scanner diagnosis, labor, oil change), with code, description, price and estimated duration. Access restricted to users with the MANAGER role or above.
maintenance.response.notfound=Service not found
maintenance.response.conflict=Code already registered
maintenance.response.forbidden=The authenticated user is not allowed to manage the service catalog

maintenance.create.summary=Register a new service
maintenance.create.description=Registers a new service in the catalog with a unique code, description, price and estimated duration in minutes.
maintenance.create.response.success=Service registered successfully
maintenance.create.response.badrequest=Invalid data for service registration

maintenance.update.summary=Update an existing service
maintenance.update.description=Updates the code, description, price and estimated duration of a service based on the given id.
maintenance.update.response.success=Service updated successfully
maintenance.update.response.badrequest=Invalid data for service update

maintenance.get.summary=Get a service by id
maintenance.get.description=Returns the data of a service based on the given id
maintenance.get.response.success=Service found successfully

maintenance.list.summary=List services
maintenance.list.description=Returns the registered services ordered by description. Filters are optional and combined (all of them must match); without filters, returns all active services.
maintenance.list.parameter.code=Full or partial code. Case-insensitive.
maintenance.list.parameter.description=Part of the service description, case-insensitive.
maintenance.list.parameter.active=Service status. Default: true (active only); use false to list inactive ones.
maintenance.list.response.success=Service list returned successfully

maintenance.deactivate.summary=Deactivate a service
maintenance.deactivate.description=Deactivates a service based on the given id. It is no longer listed for new quotations, but existing quotations and work orders are kept.
maintenance.deactivate.response.success=Service deactivated successfully
maintenance.deactivate.response.conflict=Service is already inactive
maintenance.activate.summary=Activate a service
maintenance.activate.description=Reactivates an inactive service based on the given id. It is listed again and can be used in new quotations.
maintenance.activate.response.success=Service activated successfully
maintenance.activate.response.conflict=Service is already active

quotation.tag.description=Quotations of a work order, with the planned supplies and services and the total amount. A work order can have many quotations, but only one open at a time. The quotation supplies are reserved in stock. Access for MECHANIC or higher; customers can only read their own quotations, except drafts (DRAFT).
quotation.response.notfound=Quotation not found
quotation.response.forbidden=The authenticated user is not allowed to perform this quotation operation

quotation.create.summary=Create a new quotation
quotation.create.description=Creates a draft (DRAFT) quotation for the given work order, copying the current description and price of each supply and service, and reserves the supply quantities in stock. The work order must be IN_DIAGNOSIS, or AWAITING_APPROVAL after the previous quotation was rejected. The work order status does not change until the quotation is completed.
quotation.create.response.success=Quotation created successfully
quotation.create.response.badrequest=Invalid data for quotation creation
quotation.create.response.notfound=Work order, supply or service not found
quotation.create.response.conflict=The work order is neither in diagnosis nor awaiting approval, already has an open quotation, there is not enough available stock, or the supply/service is inactive

quotation.update.summary=Update an existing quotation
quotation.update.description=Replaces the description, odometer and items of a draft (DRAFT) quotation. Stock reservations are adjusted by the quantity difference.
quotation.update.response.success=Quotation updated successfully
quotation.update.response.badrequest=Invalid data for quotation update
quotation.update.response.conflict=The quotation is not a draft, there is not enough available stock, or the supply/service is inactive

quotation.complete.summary=Completes a quotation
quotation.complete.description=Completes the draft quotation, which moves to AWAITING_APPROVAL and can no longer be changed. The work order moves to AWAITING_APPROVAL and the approval link is sent to the customer.
quotation.complete.response.success=Quotation completed successfully
quotation.complete.response.conflict=The quotation is not a draft

quotation.get.summary=Find a quotation by id
quotation.get.description=Returns the quotation with its items and total amount. Customers can only read their own quotations and do not see drafts (DRAFT).
quotation.get.response.success=Quotation found successfully

quotation.list.summary=List quotations
quotation.list.description=Returns quotations from newest to oldest. Filters are optional and combined. Customers only receive their own quotations, without drafts (DRAFT).
quotation.list.parameter.workOrderId=Work order id.
quotation.list.parameter.customerId=Customer id.
quotation.list.parameter.vehicleId=Vehicle id.
quotation.list.parameter.status=Quotation status (DRAFT, AWAITING_APPROVAL, APPROVED, REJECTED or DISCARDED).
quotation.list.response.success=Quotation list returned successfully

workorder.tag.description=Work orders for a customer's vehicle and the tracking of their status. Items and amounts are kept in the quotations linked to the work order. Access for MECHANIC or higher; customers can only read and list their own work orders.
workorder.response.notfound=Work order not found
workorder.response.forbidden=The authenticated user is not allowed to perform this work order operation

workorder.create.summary=Creates a new work order
workorder.create.description=Opens a work order for the given customer's vehicle. The initial status is RECEIVED.
workorder.create.response.success=Work order created successfully
workorder.create.response.badrequest=Invalid data to create the work order or the vehicle does not belong to the customer
workorder.create.response.notfound=Customer or vehicle not found

workorder.diagnosis.summary=Starts the diagnosis of a work order
workorder.diagnosis.description=Records the start of the vehicle diagnosis. The work order moves from RECEIVED to IN_DIAGNOSIS and the quotation can then be created.
workorder.diagnosis.response.success=Diagnosis started successfully
workorder.diagnosis.response.conflict=The work order is not RECEIVED

workorder.finish.summary=Finishes a work order
workorder.finish.description=Records the end of the service execution. The work order moves from IN_EXECUTION to FINISHED and the finish date is set.
workorder.finish.response.success=Work order finished successfully
workorder.finish.response.conflict=The work order is not IN_EXECUTION

workorder.deliver.summary=Delivers the vehicle of a work order
workorder.deliver.description=Records the delivery of the vehicle to the customer. The work order moves from FINISHED to DELIVERED and can no longer change.
workorder.deliver.response.success=Delivery recorded successfully
workorder.deliver.response.conflict=The work order is not FINISHED

workorder.cancel.summary=Cancels a work order
workorder.cancel.description=Cancels the work order when the customer gives up on the service. Allowed while the work order is RECEIVED, IN_DIAGNOSIS or AWAITING_APPROVAL, as long as no quotation is awaiting approval. A draft quotation is discarded (DISCARDED) and the stock reservation of its supplies is released. The status becomes CANCELLED and can no longer change.
workorder.cancel.response.success=Work order cancelled successfully
workorder.cancel.response.conflict=The work order cannot be cancelled in its current status or has a quotation awaiting approval

workorder.get.summary=Finds a work order by id
workorder.get.description=Returns the work order with its status history. Customers can only read their own work orders.
workorder.get.response.success=Work order found successfully

workorder.list.summary=Lists the work orders
workorder.list.description=Returns the work orders from newest to oldest. Filters are optional and combined. Customers only receive their own work orders.
workorder.list.parameter.customerId=Customer id.
workorder.list.parameter.document=Customer full CPF or CNPJ, with or without punctuation. Exact match.
workorder.list.parameter.vehicleId=Vehicle id.
workorder.list.parameter.status=Work order status (RECEIVED, IN_DIAGNOSIS, AWAITING_APPROVAL, IN_EXECUTION, FINISHED, DELIVERED or CANCELLED).
workorder.list.response.success=Work order list returned successfully

workorder.metrics.executionTime.summary=Calculates the average execution time of work orders
workorder.metrics.executionTime.description=Considers the work orders finished (FINISHED) in the period, by finish date. The execution time is the time spent IN_EXECUTION; the stages show the average time in each status until the change to the next status. Times are in minutes. Without a period, considers the last 30 days. Access for MANAGER or higher.
workorder.metrics.executionTime.parameter.from=Period start (ISO-8601, e.g. 2026-10-01T00:00:00Z). Default: 30 days before the end.
workorder.metrics.executionTime.parameter.to=Period end (ISO-8601, e.g. 2026-10-31T23:59:59Z). Default: now.
workorder.metrics.executionTime.response.success=Average execution time calculated successfully
workorder.metrics.executionTime.response.badrequest=Invalid period: the start is after the end or the date is not in ISO-8601 format

quotation.approvalLink.summary=Returns the quotation approval link
quotation.approvalLink.description=Returns the same approval link sent to the customer, so the workshop can share it manually (for example, through WhatsApp). If the current link has expired or does not exist, a new link valid for 72 hours is generated.
quotation.approvalLink.response.success=Approval link returned successfully
quotation.decision.response.conflict=The quotation is not awaiting approval or the work order cannot start the execution

quotation.decide.summary=Approves or rejects the own quotation
quotation.decide.description=Allows the authenticated customer to decide on a quotation awaiting approval (APPROVE or REJECT). On approval, the work order moves to IN_EXECUTION. On rejection, optionally informing the reason, the stock reservation of the supplies is released and the work order awaits a new quotation.
quotation.decide.response.success=Decision registered successfully
quotation.decide.response.badrequest=Invalid data for the quotation decision

quotationApproval.tag.description=Approval of quotations through the link sent to the customer, without login. The link is valid for 72 hours, can be used only once and requires the last 4 digits of the customer document to approve or reject.
quotationApproval.parameter.token=Approval link token.
quotationApproval.response.notfound=Approval link does not exist, has expired or was already used
quotationApproval.response.badrequest=Invalid data or the last digits of the document do not match
quotationApproval.response.conflict=The quotation is not awaiting approval or the work order cannot start the execution

quotationApproval.get.summary=Reads the quotation through the approval link
quotationApproval.get.description=Returns the items, the total amount, the vehicle and the link expiration, without customer personal data besides the name.
quotationApproval.get.response.success=Quotation found successfully

quotationApproval.decide.summary=Approves or rejects the quotation through the link
quotationApproval.decide.description=Registers the decision (APPROVE or REJECT) after checking the last 4 digits of the customer document, and the link is no longer valid. On approval, the work order moves to IN_EXECUTION. On rejection, optionally informing the reason, the stock reservation is released.
quotationApproval.decide.response.success=Decision registered successfully
