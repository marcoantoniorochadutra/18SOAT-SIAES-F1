services:
  siaes-postgres:
    image: postgres:17-alpine
    container_name: siaes-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-siaes}
      POSTGRES_USER: ${DB_USERNAME:-siaes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-siaes}
    ports:
      - "5432:5432"
    volumes:
      - siaes-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siaes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  siaes-postgres-data:
