services:
  siaes-app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: siaes-app:latest
    container_name: siaes-app
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: siaes-postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-siaes}
      DB_USERNAME: ${DB_USERNAME:-siaes}
      DB_PASSWORD: ${DB_PASSWORD:-siaes}
      MAIL_HOST: siaes-mailpit
      MAIL_PORT: 1025
    ports:
      - "8715:8715"
    depends_on:
      siaes-postgres:
        condition: service_healthy
      siaes-mailpit:
        condition: service_started

  siaes-postgres:
    image: postgres:17-alpine
    container_name: siaes-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-siaes}
      POSTGRES_USER: ${DB_USERNAME:-siaes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-siaes}
    ports:
      - "5432:5432"
    volumes:
      - siaes-postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-siaes} -d ${DB_NAME:-siaes}"]
      interval: 5s
      timeout: 5s
      retries: 5

  siaes-mailpit:
    image: axllent/mailpit:latest
    container_name: siaes-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  siaes-postgres-data:
